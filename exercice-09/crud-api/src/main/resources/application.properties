spring.application.name=dogs-api

# Connexion MySQL : valeurs par défaut pour un lancement local (port forwardé), surchargées par variables d'environnement dans Docker
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dogsdb}
spring.datasource.username=${DB_USER:dogs}
spring.datasource.password=${DB_PASSWORD:dogspass}

# Hibernate crée / met à jour les tables à partir des entités
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# URL de l'API de logs (nom de service Docker en conteneur)
logs.api.url=${LOGS_API_URL:http://localhost:8081/api/v1/logs}
